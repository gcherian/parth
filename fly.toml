app = "parth-ai"
primary_region = "bom"   # Mumbai — closest to Indian pilot users

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8000"
  TUTOR_BACKEND = "anthropic"
  DATA_DIR = "/data"
  # Secrets — set via `fly secrets set` (never commit actual values here):
  #   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
  #   fly secrets set DATABASE_URL=postgresql://...
  #   fly secrets set PARTH_API_KEY=$(openssl rand -hex 32)
  #   fly secrets set ADMIN_KEY=$(openssl rand -hex 32)

# Mount a persistent volume for ChromaDB so NCERT RAG survives deploys
[[mounts]]
  source = "parth_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
