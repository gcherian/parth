<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parth — Live Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f1117;
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  border-bottom: 1px solid #1e2130;
  background: #0b0d14;
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand h1 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #f8fafc;
}

.brand p {
  font-size: 0.78rem;
  color: #64748b;
  margin-top: 2px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

.counter {
  font-size: 0.82rem;
  color: #94a3b8;
  min-width: 90px;
  text-align: right;
}

button {
  border: none;
  border-radius: 8px;
  padding: 8px 18px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
button:hover { opacity: 0.88; transform: translateY(-1px); }
button:active { transform: translateY(0); }
button:disabled { opacity: 0.4; cursor: default; transform: none; }

#btnRun  { background: #f97316; color: #fff; }
#btnReset { background: transparent; color: #94a3b8; border: 1px solid #2d3446; }

/* ── Grid ── */
main {
  flex: 1;
  padding: 20px 20px 0;
}

#grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}

/* ── Card ── */
.card {
  background: #131720;
  border: 1px solid #1e2130;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s;
  min-height: 320px;
}

.card.active {
  border-color: #f9731640;
  box-shadow: 0 0 18px 2px #f9731618;
}

.card.done {
  border-color: #1e2130;
  box-shadow: none;
}

/* Card header */
.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid #1e2130;
  background: #0d1018;
}

.avatar { font-size: 1.3rem; line-height: 1; flex-shrink: 0; }
.card-name { font-weight: 700; font-size: 0.88rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.badge {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
  letter-spacing: 0.03em;
}
.badge-grade { background: #1e2130; color: #94a3b8; }
.badge-sci   { background: #0891b220; color: #22d3ee; border: 1px solid #0891b240; }
.badge-math  { background: #7c3aed20; color: #a78bfa; border: 1px solid #7c3aed40; }
.badge-gen   { background: #64748b20; color: #94a3b8;  border: 1px solid #64748b40; }

/* Message feed */
.feed {
  flex: 1;
  padding: 10px 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 0;
  max-height: 210px;
  scrollbar-width: thin;
  scrollbar-color: #2d3446 transparent;
}

.feed::-webkit-scrollbar { width: 4px; }
.feed::-webkit-scrollbar-thumb { background: #2d3446; border-radius: 4px; }

.idle-msg {
  color: #334155;
  font-size: 0.78rem;
  text-align: center;
  margin: auto;
}

.bubble {
  max-width: 88%;
  padding: 7px 10px;
  border-radius: 10px;
  font-size: 0.78rem;
  line-height: 1.45;
  word-wrap: break-word;
  animation: fadeUp 0.25s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.bubble.child {
  align-self: flex-start;
  background: #1e2130;
  color: #e2e8f0;
  border-bottom-left-radius: 3px;
}

.bubble.parth {
  align-self: flex-end;
  background: #1e1810;
  color: #fde68a;
  border-bottom-right-radius: 3px;
}

.bubble.error {
  align-self: center;
  background: #2d1515;
  color: #f87171;
  font-size: 0.72rem;
}

/* Typing indicator */
.typing {
  align-self: flex-end;
  display: flex;
  gap: 3px;
  padding: 8px 10px;
  background: #1e1810;
  border-radius: 10px;
  border-bottom-right-radius: 3px;
}
.typing span {
  width: 5px; height: 5px;
  background: #f97316;
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30%            { transform: translateY(-4px); opacity: 1; }
}

/* Status bar */
.card-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-top: 1px solid #1e2130;
  background: #0d1018;
  min-height: 30px;
}

.emotion-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #334155;
  flex-shrink: 0;
  transition: background 0.5s;
}

.status-text {
  font-size: 0.7rem;
  color: #475569;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.progress-bar {
  width: 40px;
  height: 3px;
  background: #1e2130;
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: #f97316;
  border-radius: 2px;
  transition: width 0.5s ease;
  width: 0%;
}

/* ── Footer ── */
footer {
  margin-top: 16px;
  padding: 14px 28px;
  border-top: 1px solid #1e2130;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0b0d14;
}

.footer-text {
  font-size: 0.78rem;
  color: #475569;
  max-width: 560px;
  line-height: 1.5;
}

.total-counter {
  font-size: 0.9rem;
  font-weight: 700;
  color: #f97316;
}
.total-counter span { color: #64748b; font-weight: 400; font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>पार्थ &middot; Parth</h1>
    <p>Every child deserves a tutor who knows them</p>
  </div>
  <div class="controls">
    <div class="counter" id="activeCounter">0 / 15 active</div>
    <button id="btnReset" onclick="resetDemo()">&#9209; Reset</button>
    <button id="btnRun"   onclick="runDemo()">&#9654; Run Demo</button>

<main>

<footer>

  <div class="total-counter">

</footer>

const EMOTIONS = {
  excited:   '#22c55e',
  confused:  '#f59e0b',
  neutral:   '#475569',
  frustrated:'#ef4444',
  curious:   '#3b82f6',
  amazed:    '#a855f7'
};

// Infer emotion from message text (simple heuristics for visual flair)
function detectEmotion(text) {
  const t = text.toLowerCase();
  if (/wow|insane|crazy|wild|no way|oh my god|amazing|that's the same|i never thought/.test(t)) return 'amazed';
  if (/!/.test(t) && /oh|so cool|get it|actually/.test(t)) return 'excited';
  if (/i can't|give up|never get|too many|makes no sense|mushkil/.test(t)) return 'frustrated';
  if (/why|how|what if|does that mean|so.*right\?|is that right|are you sure/.test(t)) return 'curious';
  if (/wait|i thought|can't be|what is this/.test(t)) return 'confused';
  return 'neutral';
}

function subjectBadgeClass(subject) {
  if (subject === 'Science')     return 'badge-sci';
  if (subject === 'Mathematics') return 'badge-math';
  return 'badge-gen';
}

function rand(min, max) { return Math.random() * (max - min) + min; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

let totalMessages = 0;
let activeCount   = 0;
let running       = false;
let abortControllers = [];

// Semaphore — max 3 concurrent Ollama calls (Ollama is single-threaded; >3 just adds queue time)
let _slots = 3;
const _queue = [];
function acquireSlot(signal) {
  if (_slots > 0) { _slots--; return Promise.resolve(); }
  return new Promise((res, rej) => {
    const entry = { res, signal };
    _queue.push(entry);
    signal.addEventListener('abort', () => {
      const idx = _queue.indexOf(entry);
      if (idx !== -1) _queue.splice(idx, 1);
      rej(new DOMException('Aborted', 'AbortError'));
    });
  }).then(() => { _slots--; });
}
function releaseSlot() {
  _slots++;
  if (_queue.length > 0) _queue.shift().res();
}

function updateCounters() {
  document.getElementById('activeCounter').textContent = `${activeCount} / 15 active`;
  document.getElementById('totalMsgs').textContent = totalMessages;
}

// Build the grid
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  PERSONAS.forEach(p => {
    const subBadge = subjectBadgeClass(p.subject);
    grid.insertAdjacentHTML('beforeend', `
      <div class="card" id="card-${p.id}">
        <div class="card-head">
          <span class="avatar">${p.avatar}</span>
          <span class="card-name">${p.name}</span>
          <span class="badge badge-grade">G${p.grade}</span>
          <span class="badge ${subBadge}">${p.subject === 'Mathematics' ? 'Math' : p.subject}</span>
        </div>
        <div class="feed" id="feed-${p.id}">
          <div class="idle-msg">Waiting…</div>
        </div>
        <div class="card-foot">
          <div class="emotion-dot" id="dot-${p.id}"></div>
          <div class="status-text" id="status-${p.id}">Idle</div>
          <div class="progress-bar"><div class="progress-fill" id="prog-${p.id}"></div></div>
        </div>
      </div>`);
  });
}

function addBubble(feedEl, text, side) {
  // Remove idle message if present
  const idle = feedEl.querySelector('.idle-msg');
  if (idle) idle.remove();

  const div = document.createElement('div');
  div.className = `bubble ${side}`;
  div.textContent = text;
  feedEl.appendChild(div);
  feedEl.scrollTop = feedEl.scrollHeight;
  return div;
}

function showTyping(feedEl) {
  const el = document.createElement('div');
  el.className = 'typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  el.id = `typing-${Date.now()}`;
  feedEl.appendChild(el);
  feedEl.scrollTop = feedEl.scrollHeight;
  return el;
}

async function runPersona(persona, signal) {
  const card    = document.getElementById(`card-${persona.id}`);
  const feed    = document.getElementById(`feed-${persona.id}`);
  const dot     = document.getElementById(`dot-${persona.id}`);
  const status  = document.getElementById(`status-${persona.id}`);
  const prog    = document.getElementById(`prog-${persona.id}`);
  const total   = persona.messages.length;
  const history = [];

  card.classList.add('active');
  activeCount++;
  updateCounters();

  for (let i = 0; i < total; i++) {
    if (signal.aborted) break;

    const msg = persona.messages[i];
    const emotion = detectEmotion(msg);
    dot.style.background = EMOTIONS[emotion];

    // Show child message
    addBubble(feed, msg, 'child');
    totalMessages++;
    updateCounters();
    status.textContent = 'Reading…';

    // Wait a moment before Parth replies
    await sleep(rand(300, 700));
    if (signal.aborted) break;

    // Show typing indicator
    const typingEl = showTyping(feed);
    status.textContent = 'Parth is thinking…';

    // Call the API (semaphore ensures ≤3 concurrent Ollama requests)
    let reply = null;
    try {
      await acquireSlot(signal);
      try {
        const body = {
          message:      msg,
          history:      history.slice(),
          subject:      persona.subject,
          grade:        persona.grade,
          learner_id:   persona.id,
          learner_name: persona.name
        };
        const res = await fetch('/chat', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
          signal
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        reply = data.response || '(no response)';
      } finally {
        releaseSlot();
      }
    } catch (err) {
      if (signal.aborted) break;
      typingEl.remove();
      addBubble(feed, '⚠ Server busy — retrying…', 'error');
      await sleep(3000);
      if (signal.aborted) break;
      // one retry (also goes through semaphore)
      try {
        await acquireSlot(signal);
        try {
          const body = { message: msg, history: history.slice(), subject: persona.subject, grade: persona.grade, learner_id: persona.id, learner_name: persona.name };
          const res  = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), signal });
          const data = await res.json();
          reply = data.response || '(no response)';
        } finally {
          releaseSlot();
        }
      } catch (_) {
        reply = null;
      }
    }

    if (signal.aborted) break;
    typingEl.remove();

    if (reply) {
      // Update history
      history.push({ role: 'user',      content: msg   });
      history.push({ role: 'assistant', content: reply });

      addBubble(feed, reply, 'parth');
      totalMessages++;
      updateCounters();

      const replyEmotion = detectEmotion(msg); // keep child's emotion driving the dot
      dot.style.background = EMOTIONS[replyEmotion];
    } else {
      addBubble(feed, '⚠ No response from server', 'error');
    }

    // Update progress
    prog.style.width = `${((i + 1) / total) * 100}%`;
    status.textContent = `${i + 1} / ${total} messages`;

    // Pause before next child message (simulates child reading & typing)
    if (i < total - 1) {
      await sleep(rand(1800, 2800));
    }
  }

  if (!signal.aborted) {
    card.classList.remove('active');
    card.classList.add('done');
    status.textContent = 'Conversation done';
    dot.style.background = EMOTIONS['neutral'];
  }

  activeCount = Math.max(0, activeCount - 1);
  updateCounters();
}

async function runDemo() {
  if (running) return;
  running = true;
  document.getElementById('btnRun').disabled   = true;
  document.getElementById('btnReset').disabled = false;

  abortControllers = PERSONAS.map(() => new AbortController());

  const promises = PERSONAS.map((p, i) => {
    const delay = rand(0, 1500);
    return sleep(delay).then(() => runPersona(p, abortControllers[i].signal));
  });

  await Promise.allSettled(promises);
  running = false;
  document.getElementById('btnRun').disabled = false;
}

function resetDemo() {
  // Abort all running conversations
  abortControllers.forEach(ac => ac.abort());
  abortControllers = [];
  running      = false;
  activeCount  = 0;
  totalMessages = 0;
  // Reset semaphore — aborted waiters already removed themselves
  _slots = 3;
  _queue.length = 0;
  updateCounters();
  document.getElementById('btnRun').disabled   = false;
  document.getElementById('btnReset').disabled = false;
  buildGrid();
}

// Init
buildGrid();
updateCounters();
</script>
</body>
</html>
