<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parth Meaning Graph</title>
<link rel="icon" href="data:,">
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #101418;
    color: #e6edf3;
  }

  header {
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 10px 18px;
    background: #151b22;
    border-bottom: 1px solid #2c3642;
  }

  .title {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 190px;
  }

  .title strong {
    font-size: 17px;
    font-weight: 750;
    color: #f7fafc;
  }

  .title span {
    color: #93a4b7;
    font-size: 12px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
  }

  label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #9badbf;
    font-size: 12px;
  }

  input, select, button {
    font: inherit;
    color: #e6edf3;
  }

  input[type="range"] {
    width: 112px;
    accent-color: #f59e0b;
  }

  input[type="text"], select {
    min-height: 32px;
    background: #0f141a;
    border: 1px solid #334151;
    border-radius: 6px;
    padding: 5px 9px;
    outline: none;
  }

  input[type="text"] { width: 132px; }
  select { width: 142px; }

  input[type="text"]:focus, select:focus {
    border-color: #38bdf8;
  }

  button {
    min-height: 32px;
    border: 1px solid #42566b;
    border-radius: 6px;
    background: #1e2935;
    padding: 5px 11px;
    cursor: pointer;
  }

  button:hover {
    border-color: #38bdf8;
    background: #223243;
  }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
  }

  .graph-pane {
    position: relative;
    min-width: 0;
    min-height: 0;
  }

  #network {
    width: 100%;
    height: 100%;
  }

  .status {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    background: rgba(15, 20, 26, 0.86);
    border: 1px solid #2c3642;
    color: #a9b8c8;
    font-size: 12px;
    pointer-events: none;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
  }

  aside {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-left: 1px solid #2c3642;
    background: #151b22;
  }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid #2c3642;
  }

  .tab {
    border: 0;
    border-radius: 0;
    background: transparent;
    color: #8fa1b4;
    min-height: 42px;
  }

  .tab.active {
    color: #f7fafc;
    background: #1c2530;
    border-bottom: 2px solid #f59e0b;
  }

  .panel {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .panel.active { display: block; }

  .metric-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid #2c3642;
  }

  .metric {
    background: #101820;
    border: 1px solid #283542;
    border-radius: 6px;
    padding: 8px;
  }

  .metric b {
    display: block;
    font-size: 16px;
    color: #f7fafc;
  }

  .metric span {
    color: #8fa1b4;
    font-size: 11px;
  }

  .section-label {
    margin: 0 0 8px;
    color: #7d8fa3;
    font-size: 11px;
    font-weight: 750;
    text-transform: uppercase;
  }

  .detail-title {
    font-size: 20px;
    line-height: 1.2;
    font-weight: 780;
    color: #f8fafc;
    margin-bottom: 8px;
  }

  .kind {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 2px 8px;
    margin-bottom: 12px;
    border-radius: 999px;
    background: #233044;
    color: #cbd5e1;
    font-size: 11px;
    text-transform: uppercase;
  }

  .summary {
    color: #bcc9d6;
    font-size: 14px;
    line-height: 1.55;
    margin-bottom: 18px;
  }

  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 18px;
  }

  .chip {
    min-height: 24px;
    display: inline-flex;
    align-items: center;
    border: 1px solid #334151;
    border-radius: 999px;
    padding: 3px 8px;
    color: #aebdca;
    background: #0f141a;
    font-size: 12px;
  }

  .edge-line {
    padding: 9px 0;
    border-bottom: 1px solid #26323e;
    color: #b8c7d5;
    font-size: 13px;
    line-height: 1.45;
  }

  .edge-line b { color: #f1f5f9; }

  .empty {
    color: #8fa1b4;
    line-height: 1.5;
    font-size: 14px;
  }

  .puzzle {
    border: 1px solid #2c3a48;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    background: #101820;
  }

  .puzzle h3 {
    color: #f8fafc;
    font-size: 15px;
    line-height: 1.25;
    margin-bottom: 7px;
  }

  .puzzle p {
    color: #b8c7d5;
    font-size: 13px;
    line-height: 1.45;
    margin-bottom: 8px;
  }

  .puzzle small {
    display: block;
    color: #8fa1b4;
    line-height: 1.4;
  }

  .legend {
    position: absolute;
    right: 14px;
    bottom: 14px;
    display: grid;
    grid-template-columns: repeat(2, max-content);
    gap: 7px 12px;
    padding: 10px;
    border-radius: 6px;
    background: rgba(15, 20, 26, 0.9);
    border: 1px solid #2c3642;
    color: #a9b8c8;
    font-size: 11px;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
  }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; min-height: 100vh; }
    header { align-items: flex-start; flex-direction: column; }
    .toolbar { justify-content: flex-start; }
    main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
    aside { border-left: 0; border-top: 1px solid #2c3642; min-height: 420px; }
    .legend { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <strong>Parth Meaning Graph</strong>
    <span>Stories, motifs, nature bridges, and bedtime puzzles</span>
  </div>
  <div class="toolbar">
    <label>Age <input id="age" type="range" min="5" max="10" value="8" oninput="syncAge()"><span id="ageValue">8</span></label>
    <label>Tradition
      <select id="tradition">
        <option value="">All</option>
        <option value="aesop">Aesop</option>
        <option value="panchatantra">Panchatantra</option>
        <option value="bible">Bible Parables</option>
        <option value="vedic">Vedic</option>
        <option value="indian_epic">Indian Epic</option>
        <option value="shakespeare">Shakespeare</option>
      </select>
    </label>
    <label>Motif <input id="motif" type="text" placeholder="truth"></label>
    <button onclick="loadAll()">Refresh</button>
    <button onclick="openNeo4jExport()">Neo4j</button>
  </div>
</header>

<main>
  <section class="graph-pane">
    <div id="network"></div>
    <div class="status" id="status"><span class="dot"></span><span>Loading graph</span></div>
    <div class="legend">
      <span><i class="swatch" style="background:#64748b"></i>Source</span>
      <span><i class="swatch" style="background:#f59e0b"></i>Story</span>
      <span><i class="swatch" style="background:#22c55e"></i>Motif</span>
      <span><i class="swatch" style="background:#38bdf8"></i>Concept</span>
      <span><i class="swatch" style="background:#a78bfa"></i>Question</span>
      <span><i class="swatch" style="background:#14b8a6"></i>Nature</span>
    </div>
  </section>

  <aside>
    <div class="metric-row">
      <div class="metric"><b id="nodeCount">0</b><span>nodes</span></div>
      <div class="metric"><b id="edgeCount">0</b><span>edges</span></div>
      <div class="metric"><b id="puzzleCount">0</b><span>puzzles</span></div>
    </div>
    <div class="tabs">
      <button id="tabDetails" class="tab active" onclick="showTab('details')">Details</button>
      <button id="tabPuzzles" class="tab" onclick="showTab('puzzles')">Puzzles</button>
    </div>
    <div id="detailsPanel" class="panel active">
      <div class="empty">Select a node to inspect its meaning, tags, and nearby ideas.</div>
    </div>
    <div id="puzzlesPanel" class="panel"></div>
  </aside>
</main>

<script>
let graph = {nodes: [], edges: []};
let puzzles = [];
let network = null;
let nodesDS = null;
let edgesDS = null;
let nodeMap = {};

const KIND_COLOR = {
  source: {bg: '#263241', border: '#64748b', font: '#d7dee8', shape: 'box'},
  story: {bg: '#4a3008', border: '#f59e0b', font: '#fde68a', shape: 'dot'},
  motif: {bg: '#083a2c', border: '#22c55e', font: '#bbf7d0', shape: 'dot'},
  concept: {bg: '#0b3444', border: '#38bdf8', font: '#bae6fd', shape: 'dot'},
  question: {bg: '#35205c', border: '#a78bfa', font: '#ddd6fe', shape: 'diamond'},
  nature_pattern: {bg: '#0f3f3d', border: '#14b8a6', font: '#ccfbf1', shape: 'dot'}
};

const REL_COLOR = {
  contains: '#94a3b8',
  teaches: '#f59e0b',
  asks: '#a78bfa',
  mirrors: '#14b8a6',
  bridges_to: '#38bdf8'
};

function syncAge() {
  document.getElementById('ageValue').textContent = document.getElementById('age').value;
}

function qs() {
  const age = document.getElementById('age').value;
  const tradition = document.getElementById('tradition').value;
  const motif = document.getElementById('motif').value.trim();
  const params = new URLSearchParams({age});
  if (tradition) params.set('tradition', tradition);
  if (motif) params.set('motif', motif);
  return params;
}

async function loadAll() {
  setStatus('Loading graph');
  const graphParams = qs();
  graphParams.delete('motif');
  const puzzleParams = qs();
  const [graphRes, puzzleRes] = await Promise.all([
    fetch('/meaning/graph?' + graphParams.toString()),
    fetch('/meaning/puzzles?' + puzzleParams.toString())
  ]);
  if (!graphRes.ok || !puzzleRes.ok) {
    setStatus('Load failed');
    return;
  }
  graph = await graphRes.json();
  const puzzlePayload = await puzzleRes.json();
  puzzles = puzzlePayload.puzzles || [];
  nodeMap = Object.fromEntries(graph.nodes.map(n => [n.id, n]));
  renderGraph();
  renderPuzzles();
  updateMetrics();
  setStatus(`${graph.nodes.length} nodes ready`);
}

function renderGraph() {
  const visNodes = graph.nodes.map(nodeToVis);
  const visEdges = graph.edges.map(edgeToVis);
  if (!network) {
    nodesDS = new vis.DataSet(visNodes);
    edgesDS = new vis.DataSet(visEdges);
    network = new vis.Network(
      document.getElementById('network'),
      {nodes: nodesDS, edges: edgesDS},
      networkOptions()
    );
    network.on('click', event => {
      if (event.nodes.length) {
        showNode(event.nodes[0]);
        showTab('details');
      }
    });
  } else {
    nodesDS.clear();
    edgesDS.clear();
    nodesDS.add(visNodes);
    edgesDS.add(visEdges);
    network.fit({animation: true});
  }
}

function nodeToVis(node) {
  const color = KIND_COLOR[node.kind] || KIND_COLOR.concept;
  const relationCount = graph.edges.filter(e => e.source === node.id || e.target === node.id).length;
  const short = node.label.length > 24 ? node.label.slice(0, 23) + '...' : node.label;
  return {
    id: node.id,
    label: short,
    title: `<b>${escapeHtml(node.label)}</b><br>${escapeHtml(node.kind.replace('_', ' '))}`,
    shape: color.shape,
    size: 17 + Math.min(relationCount, 8) * 2,
    color: {
      background: color.bg,
      border: color.border,
      highlight: {background: color.bg, border: '#f8fafc'},
      hover: {background: color.bg, border: '#f8fafc'}
    },
    borderWidth: 2,
    font: {color: color.font, size: 12, face: '-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'}
  };
}

function edgeToVis(edge) {
  return {
    from: edge.source,
    to: edge.target,
    label: edge.relation === 'contains' ? '' : edge.relation.replace('_', ' '),
    title: escapeHtml(edge.rationale || edge.relation),
    arrows: edge.relation === 'contains' ? '' : 'to',
    color: {color: REL_COLOR[edge.relation] || '#64748b', opacity: 0.82},
    dashes: edge.relation === 'mirrors',
    width: 1 + Math.max(0, Number(edge.weight || 1) - 0.7) * 3,
    font: {size: 9, color: '#8fa1b4', strokeWidth: 0}
  };
}

function networkOptions() {
  return {
    autoResize: true,
    physics: {
      stabilization: {iterations: 130},
      barnesHut: {
        gravitationalConstant: -4800,
        centralGravity: 0.15,
        springLength: 130,
        springConstant: 0.035,
        damping: 0.32
      }
    },
    interaction: {hover: true, tooltipDelay: 120},
    edges: {smooth: {type: 'dynamic'}}
  };
}

function showNode(id) {
  const node = nodeMap[id];
  if (!node) return;
  const linked = graph.edges
    .filter(e => e.source === id || e.target === id)
    .map(e => {
      const otherId = e.source === id ? e.target : e.source;
      const other = nodeMap[otherId] || {label: otherId};
      const direction = e.source === id ? 'to' : 'from';
      return `<div class="edge-line"><b>${escapeHtml(e.relation.replace('_', ' '))}</b> ${direction} ${escapeHtml(other.label)}<br>${escapeHtml(e.rationale || '')}</div>`;
    }).join('');

  document.getElementById('detailsPanel').innerHTML = `
    <div class="kind">${escapeHtml(node.kind.replace('_', ' '))}${node.tradition ? ' - ' + escapeHtml(node.tradition) : ''}</div>
    <div class="detail-title">${escapeHtml(node.label)}</div>
    <div class="summary">${escapeHtml(node.summary || '')}</div>
    <div class="section-label">Tags</div>
    <div class="chip-list">${(node.tags || []).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('') || '<span class="empty">No tags</span>'}</div>
    <div class="section-label">Connections</div>
    ${linked || '<div class="empty">No visible connections under the current filter.</div>'}
  `;
}

function renderPuzzles() {
  const panel = document.getElementById('puzzlesPanel');
  if (!puzzles.length) {
    panel.innerHTML = '<div class="empty">No puzzles match this filter.</div>';
    return;
  }
  panel.innerHTML = puzzles.map(p => `
    <article class="puzzle" onclick="focusStory('${escapeAttr(p.story_id)}')">
      <h3>${escapeHtml(p.title)}</h3>
      <p>${escapeHtml(p.suspense_question)}</p>
      <small>${escapeHtml(p.story_label)} - ${escapeHtml(p.tradition || 'shared wisdom')}</small>
      <div class="chip-list" style="margin:10px 0 0">
        ${(p.motif_ids || []).slice(0, 3).map(id => `<span class="chip">${escapeHtml(cleanId(id))}</span>`).join('')}
      </div>
    </article>
  `).join('');
}

function focusStory(storyId) {
  if (network && nodeMap[storyId]) {
    network.selectNodes([storyId]);
    network.focus(storyId, {scale: 1.25, animation: true});
    showNode(storyId);
    showTab('details');
  }
}

function showTab(name) {
  document.getElementById('tabDetails').classList.toggle('active', name === 'details');
  document.getElementById('tabPuzzles').classList.toggle('active', name === 'puzzles');
  document.getElementById('detailsPanel').classList.toggle('active', name === 'details');
  document.getElementById('puzzlesPanel').classList.toggle('active', name === 'puzzles');
}

function updateMetrics() {
  document.getElementById('nodeCount').textContent = graph.nodes.length;
  document.getElementById('edgeCount').textContent = graph.edges.length;
  document.getElementById('puzzleCount').textContent = puzzles.length;
}

function setStatus(text) {
  document.querySelector('#status span:last-child').textContent = text;
}

function openNeo4jExport() {
  window.open('/meaning/neo4j/export', '_blank');
}

function cleanId(id) {
  return String(id).replace(/^motif_/, '').replace(/^concept_/, '').replaceAll('_', ' ');
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  })[c]);
}

function escapeAttr(value) {
  return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

document.getElementById('tradition').addEventListener('change', loadAll);
document.getElementById('motif').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadAll();
});
document.getElementById('age').addEventListener('change', loadAll);
syncAge();
loadAll();
</script>
</body>
</html>
